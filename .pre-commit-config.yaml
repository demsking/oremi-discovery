# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: name-tests-test
      - id: requirements-txt-fixer
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: \.py$
        args: [
          '--license-filepath', 'LICENSE_HEADER.txt',
          '--comment-style', '',
          '--use-current-year',
          '--no-extra-eol',
        ]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.28.1
    hooks:
      - id: check-gitlab-ci
  - repo: https://github.com/asottile/reorder-python-imports
    rev: v3.12.0
    hooks:
      - id: reorder-python-imports
  - repo: local
    hooks:
      - id: editorconfig-checker-system
        name: 'Check .editorconfig rules'
        description: 'Runs system executable of `editorconfig-checker` to lint text files according to `.editorconfig` rules'
        language: system
        entry: editorconfig-checker
        types: [ text ]
        require_serial: true
      - id: autopep8
        name: 'Fix Python Code Style using AutoPEP8'
        description: 'Runs `autopep8` to format Python code.'
        entry: autopep8
        language: system
        files: '\.py$'
        args: [
          '--in-place',
          '--recursive',
          # Error codes: https://pycodestyle.pycqa.org/en/latest/intro.html#error-codes
          '--ignore', 'E1,E501',
        ]
      - id: run-pytest
        name: Run Pytest
        entry: make test-python
        language: system
        types: [python]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
